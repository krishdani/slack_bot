# Render Blueprint — deploys the bot as a Python Web Service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tpf-community-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      # --- Optional second (REPLY) bot: separate Slack app, its own token +
      # secret. Set both to split the AI reply-suggestion feature onto
      # /slack/reply-events. Leave unset to keep everything on the primary bot.
      - key: REPLY_SLACK_BOT_TOKEN
        sync: false
      - key: REPLY_SLACK_SIGNING_SECRET
        sync: false
      # --- Optional third (RELAY) bot: separate Slack app, its own token +
      # secret. Set both to serve the "DM me every message" relay from its own
      # bot on /slack/relay-events. Setting the token also switches the relay
      # feature on by default.
      - key: RELAY_SLACK_BOT_TOKEN
        sync: false
      - key: RELAY_SLACK_SIGNING_SECRET
        sync: false
      # Slack user ID of the community handler: receives the daily report and
      # every real-time alert. HUMAN_POC_USER_ID is accepted as a fallback.
      - key: HANDLER_SLACK_USER
        sync: false
      # Optional user token (xoxp-) so the welcome DM is authored by the handler
      # instead of the bot. Unset => the bot sends it, as before.
      - key: HANDLER_USER_TOKEN
        sync: false
      # Shared secret protecting the /tasks/* triggers.
      - key: DIGEST_TRIGGER_TOKEN
        sync: false
      # Hours of history the daily report covers (safe to commit a default).
      - key: DAILY_WINDOW_HOURS
        value: "24"
      # Optional OpenAI key for smarter report classification + moderation.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # --- Real-time alerts & moderation ---
      - key: REALTIME_MEMBER_ALERTS
        value: "on"
      - key: MODERATION_ENABLED
        value: "on"
      - key: MODERATION_CONFIDENCE_THRESHOLD
        value: "0.7"
      - key: MODERATION_MIN_CHARS
        value: "15"
      - key: MODERATE_UNCONFIGURED_CHANNELS
        value: "off"
      - key: MODERATE_THREAD_REPLIES
        value: "off"
      # --- Reply suggestions --- (WARNING: 'on' DMs a draft for EVERY message)
      - key: REPLY_SUGGESTIONS_ENABLED
        value: "on"
      - key: REPLY_SUGGESTIONS_MIN_CHARS
        value: "15"
      - key: REPLY_SUGGESTIONS_INCLUDE_THREADS
        value: "on"
      # --- Message relay --- (DMs the handler a COPY of every message; no AI)
      - key: MESSAGE_RELAY_ENABLED
        value: "on"
      - key: MESSAGE_RELAY_MIN_CHARS
        value: "0"
      - key: MESSAGE_RELAY_INCLUDE_THREADS
        value: "on"
      - key: MESSAGE_RELAY_INCLUDE_BOTS
        value: "off"
      # Off-request workers for AI + DM work, so Slack always gets a fast ack.
      # Keep gunicorn single-worker (default) so these threads are shared.
      - key: BACKGROUND_WORKERS
        value: "4"
